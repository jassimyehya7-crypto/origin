<svg xmlns="http://www.w3.org/2000/svg" width="420" height="112" viewBox="0 0 420 112" role="img" aria-labelledby="title desc">
  <title id="title">Épicerie Club</title>
  <desc id="desc">Un carré jaune contenant la lettre é, suivi du texte picerie Club.</desc>
  <g transform="translate(8 8) rotate(-3 48 48)">
    <rect x="2" y="2" width="92" height="92" rx="24" fill="#EAFF4F" stroke="#171B15" stroke-width="5"/>
    <text x="48" y="69" text-anchor="middle" fill="#171B15" font-family="Georgia, serif" font-size="68" font-weight="700">é</text>
  </g>
  <text x="116" y="70" fill="#171B15" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-1.5">picerie <tspan font-weight="400">Club</tspan></text>
</svg>
